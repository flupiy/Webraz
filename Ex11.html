<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 3 - Редирект</title>
    
    <script type="text/javascript">
        // Функция для переадресации
        function redirect() {
            window.location.href = "https://slobkoll.ru"; // Адрес, куда перекидываем
        }

        // Запускаем таймер на 5000 миллисекунд (5 секунд)
        setTimeout(redirect, 5000);
    </script>
</head>
<body>
    <h2>Вы будете перенаправлены на другой сайт через 5 секунд...</h2>
    <p>Если этого не произошло, нажмите <a href="https://slobkoll.ru">сюда</a>.</p>
</body>
</html>
