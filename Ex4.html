<body> 
    <h2>Задание 1. Работа с условием if</h2>
    <script type="text/javascript">
        var x, y;
        // Метод parseInt() переводит строку в целое число
        x = parseInt(prompt("Введите значение х", ''));
        y = parseInt(prompt("Введите значение у", ''));

        if (x < y) {
            alert("Максимальное число - y");
        } else if (x > y) {
            alert("Максимальное число - x");
        } else {
            // Дополнение для пункта 2
            alert("Введенные числа равны!");
        }
        var password = "secret123"; // Верное значение пароля
        var userPassword = prompt("Введите правильный пароль:");
        if (userPassword === password) {
            alert("Пароль верен! Добро пожаловать.");
        } else {
            alert("Неправильно введен пароль!");
        }
    </script>
