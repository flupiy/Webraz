<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Эффекты с картинками (Наведение и Клик)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        /* Контейнер для картинок */
        .bas { 
            position: relative; 
            width: 1000px; 
            margin: auto; 
            height: 550px; /* Фиксированная высота, так как картинки позиционируются абсолютно */
            background-color: #f9f9f9;
            border: 1px solid #ccc;
        }

        /* Стили для всех картинок */
        .im { 
            position: absolute; 
            width: 300px;
            height: 200px;
            object-fit: cover;
            border: 2px solid #000000; 
            z-index: 1;
            cursor: pointer;
            transition: opacity 1s; /* Плавность для исчезновения/появления */
        }

        /* Координаты для картинок (сетка 2х3) */
        #i1 {left: 20px; top: 20px;}
        #i2 {left: 340px; top: 20px;}
        #i3 {left: 660px; top: 20px;}
        #i4 {left: 20px; top: 240px;}
        #i5 {left: 340px; top: 240px;}
        #i6 {left: 660px; top: 240px;}
        
        /* Стиль для увеличенной картинки */
        .zoomed {
            z-index: 10 !important; /* Поднимаем наверх */
            width: 600px !important; /* Увеличиваем размер */
            height: 400px !important;
            left: 200px !important; /* Смещаем в центр контейнера */
            top: 75px !important;
            transition: width 1s, height 1s, left 1s, top 1s, opacity 1s !important;
        }
    </style>

    <script>
        // --- ЗАДАНИЕ 1: Эффект при наведении (mouseover / mouseout) ---
        document.addEventListener("mouseover", (ev) => {
            let e = ev.target;
            // Если навели на картинку и она сейчас не увеличена
            if (e.tagName === "IMG" && !e.classList.contains("zoomed")) {
                for (let i = 1; i < 7; i++) {
                    let b = "i" + i;
                    let img = document.getElementById(b);
                    if (e.id !== b) {
                        img.style.opacity = 0.1; // Бледнеют
                    }
                }
            }
        });

        document.addEventListener("mouseout", (ev) => {
            let e = ev.target;
            if (e.tagName === "IMG" && !e.classList.contains("zoomed")) {
                for (let i = 1; i < 7; i++) {
                    let b = "i" + i;
                    let img = document.getElementById(b);
                    img.style.opacity = 1; 
                }
            }
        });

        // --- ЗАДАНИЕ 2: Эффект при клике (увеличение) ---
        let isZoomed = false; 
        let savedLeft = 0;
        let savedTop = 0;

        document.addEventListener("click", (ev) => {
            let e = ev.target;

            if (e.tagName === "IMG") {
                if (!isZoomed) {
                    isZoomed = true;
                    savedLeft = e.offsetLeft;
                    savedTop = e.offsetTop;
                    for (let i = 1; i < 7; i++) {
                        let b = "i" + i;
                        if (e.id !== b) {
                            document.getElementById(b).style.opacity = 0;
                        }
                    }
                    
                    e.classList.add("zoomed");
                    e.style.opacity = 1; 
                    
                } else if (e.classList.contains("zoomed")) {
                    // ВТОРОЙ КЛИК (Возврат на место) - срабатывает только по увеличенной картинке
                    isZoomed = false;
                    for (let i = 1; i < 7; i++) {
                        let b = "i" + i;
                        document.getElementById(b).style.opacity = 1;
                    }
                    
                    // Убираем класс (картинка уменьшается и возвращается на место)
                    e.classList.remove("zoomed");
                    e.style.left = savedLeft + "px";
                    e.style.top = savedTop + "px";
                }
            }
        });
    </script>
</head>
<body>

    <h2 style="text-align: center;">Наведите мышку или кликните</h2>

    <div class="bas">
        <img id="i1" class="im" src="GtaVice.jpeg" alt="Фото 1">
        <img id="i2" class="im" src="Gta3.jpg" alt="Фото 2">
        <img id="i3" class="im" src="GtaSA.jpg" alt="Фото 3">
        <img id="i4" class="im" src="Gta4.jpeg" alt="Фото 4">
        <img id="i5" class="im" src="Gta5.jpeg" alt="Фото 5">
        <img id="i6" class="im" src="Gta6.jpg" alt="Фото 6">
    </div>

</body>
</html>
