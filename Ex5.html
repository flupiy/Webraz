<body> 
    <h1>Пример с линиями</h1>
    <script type="text/javascript">
        function line(widthSize) {
            document.write("<hr align='center' width='" + widthSize + "'>");
        }
        for (var i = 1; i <= 10; i++) {
            // Первая линия 10px, каждая следующая на 10px больше
            var currentWidth = i * 10; 
            line(currentWidth);
        }
    </script>
