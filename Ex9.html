<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 1 - document</title>
</head>
<body>
    <script type="text/javascript">
        // Меняем цвет фона и цвет шрифта через объект document
        document.bgColor = "#E7E6D8";
        document.fgColor = "red";

        // Выводим приветствие
        document.write("<h2>Спасибо, что пришли к нам на курсы!</h2>");
        
        // Выводим дату последней модификации
        document.write("<hr><p>Дата последней модификации документа: " + document.lastModified + "</p>");
    </script>
</body>
</html>
