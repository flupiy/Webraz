    <title>Задание 3 - Таблица степеней</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 5px 10px; text-align: center; }
    </style>
</head>
<body> 
    <h2>Таблица степеней двойки</h2>
    <script type="text/javascript">
        document.write("<table>");
        document.write("<tr><th>Степень</th><th>Результат</th></tr>");
        for (var i = 0; i <= 5; i++) {
            document.write("<tr>");
            document.write("<td>2<sup>" + i + "</sup></td>");
            var result = Math.pow(2, i);
            document.write("<td>" + result + "</td>");
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>
