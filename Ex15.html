<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 6 - Валидация формы</title>
    
    <script type="text/javascript">
        function validateForm() {
            // Получаем значения полей
            var name = document.getElementById("userName");
            var pass1 = document.getElementById("pass1");
            var pass2 = document.getElementById("pass2");
            var email = document.getElementById("email");
            var message = document.getElementById("message");

            // 1. Проверка имени
            if (name.value == "") {
                alert("Пожалуйста, введите ваше имя.");
                name.focus();
                return false;
            }

            // 2. Проверка пароля (больше 4 символов)
            if (pass1.value.length <= 4) {
                alert("Пароль должен содержать больше 4-х символов.");
                pass1.focus();
                return false;
            }

            // 3. Проверка совпадения паролей
            if (pass1.value !== pass2.value) {
                alert("Пароли не совпадают.");
                pass2.focus();
                return false;
            }

            // 4. Проверка email (наличие @)
            if (email.value == "" || email.value.indexOf("@") == -1) {
                alert("Введите корректный электронный адрес (должен содержать @).");
                email.focus();
                return false;
            }

            // 5. Проверка сообщения (больше 10 символов)
            if (message.value.length <= 10) {
                alert("Сообщение должно содержать больше 10 символов.");
                message.focus();
                return false;
            }

            // Если все проверки пройдены
            alert("Форма заполнена верно!");
            return true;
        }
    </script>
</head>
<body>

    <h2>Форма обратной связи</h2>

    <!-- onsubmit вызывает функцию. Если она вернет false - форма не отправится -->
    <form onsubmit="return validateForm()">
        
        <p>Ваше имя *<br>
        <input type="text" id="userName" size="30"></p>

        <p>Пароль *<br>
        <input type="password" id="pass1" size="30"></p>

        <p>Подтверждение пароля *<br>
        <input type="password" id="pass2" size="30"></p>

        <p>Электронный адрес: *<br>
        <input type="text" id="email" size="30"></p>

        <p>Тема сообщения:<br>
        <input type="text" id="subject" size="30"></p>

        <p>Сообщение:<br>
        <textarea id="message" rows="5" cols="30"></textarea></p>

        <p><input type="submit" value="Отправить"></p>
    </form>

</body>
</html>
